<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="750" viewBox="0 0 1000 750">
  <rect width="1000" height="750" fill="#0a0e08"/>

  <!-- signpost -->
  <g transform="translate(500,620)">
    <rect x="-8" y="-260" width="16" height="260" fill="#39472c"/>
    <g transform="rotate(-8)">
      <rect x="-190" y="-330" width="200" height="80" rx="10" fill="#11160d" stroke="#39472c" stroke-width="4"/>
      <text x="-90" y="-278" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-weight="800" font-size="42" fill="#7cfc00">404</text>
    </g>
    <g transform="rotate(6)">
      <rect x="10" y="-260" width="190" height="60" rx="10" fill="#11160d" stroke="#39472c" stroke-width="4"/>
      <path d="M40 -230 L160 -230 M140 -244 L166 -230 L140 -216" fill="none" stroke="#7cfc00" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- lost cart -->
  <g transform="translate(300,660)">
    <rect x="0" y="0" width="90" height="40" rx="8" fill="none" stroke="#69795a" stroke-width="5"/>
    <path d="M0 0 L-20 -30 L20 -30" fill="none" stroke="#69795a" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="20" cy="50" r="10" fill="none" stroke="#69795a" stroke-width="5"/>
    <circle cx="70" cy="50" r="10" fill="none" stroke="#69795a" stroke-width="5"/>
  </g>

  <text x="500" y="200" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-weight="800" font-size="46" fill="#f3f7ec">This page wandered off</text>
  <text x="500" y="244" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="20" fill="#8a9a78">Let's get you back to the market</text>
</svg>
