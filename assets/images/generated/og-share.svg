<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#7cfc00" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7cfc00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#0a0e08"/>

  <!-- soft lime glow behind phone -->
  <circle cx="860" cy="260" r="260" fill="url(#glow)"/>

  <!-- market stall: folded fabric -->
  <g transform="translate(640,330)">
    <path d="M0 90 L50 30 L100 60 L150 20 L200 90 Z" fill="#39472c"/>
    <path d="M20 90 L60 55 L100 75 L145 45 L182 90 Z" fill="#2c3821"/>
  </g>

  <!-- vehicle icon -->
  <g transform="translate(440,380)">
    <rect x="0" y="20" width="120" height="34" rx="10" fill="#39472c"/>
    <path d="M14 20 L34 -8 L92 -8 L112 20 Z" fill="#39472c"/>
    <circle cx="26" cy="58" r="14" fill="#0a0e08" stroke="#7cfc00" stroke-width="4"/>
    <circle cx="96" cy="58" r="14" fill="#0a0e08" stroke="#7cfc00" stroke-width="4"/>
  </g>

  <!-- phone with glowing screen -->
  <g transform="translate(760,140)">
    <rect x="0" y="0" width="200" height="340" rx="26" fill="#11160d" stroke="#233015" stroke-width="3"/>
    <rect x="14" y="26" width="172" height="288" rx="10" fill="#7cfc00" opacity="0.92"/>
    <rect x="34" y="60" width="132" height="86" rx="8" fill="#0a0e08" opacity="0.85"/>
    <rect x="34" y="160" width="132" height="14" rx="7" fill="#0a0e08" opacity="0.6"/>
    <rect x="34" y="184" width="90" height="14" rx="7" fill="#0a0e08" opacity="0.45"/>
    <rect x="34" y="230" width="132" height="40" rx="10" fill="#0a0e08" opacity="0.9"/>
  </g>

  <!-- wordmark -->
  <text x="70" y="560" font-family="Verdana, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="1" fill="#f3f7ec">NILE LINK</text>
  <text x="70" y="596" font-family="Verdana, Arial, sans-serif" font-size="21" fill="#8a9a78">Buy &amp; sell anything in South Sudan</text>
</svg>
