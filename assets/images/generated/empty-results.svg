<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#f6f8f3"/>

  <!-- empty market stall outline -->
  <g transform="translate(300,300)">
    <path d="M0 120 L0 40 L100 0 L200 40 L200 120" fill="none" stroke="#39472c" stroke-width="5" stroke-linejoin="round"/>
    <line x1="0" y1="120" x2="200" y2="120" stroke="#39472c" stroke-width="5"/>
    <line x1="60" y1="40" x2="60" y2="120" stroke="#39472c" stroke-width="3" opacity="0.5"/>
    <line x1="140" y1="40" x2="140" y2="120" stroke="#39472c" stroke-width="3" opacity="0.5"/>
  </g>

  <!-- magnifying glass -->
  <g transform="translate(430,230) rotate(15)">
    <circle cx="0" cy="0" r="46" fill="none" stroke="#39472c" stroke-width="7"/>
    <line x1="33" y1="33" x2="68" y2="68" stroke="#39472c" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- ping lines -->
  <g stroke="#7cfc00" stroke-width="3" stroke-dasharray="1 10" stroke-linecap="round" fill="none">
    <path d="M480 210 Q 520 190 550 205"/>
    <path d="M490 260 Q 535 260 560 250"/>
  </g>

  <text x="400" y="500" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="26" font-weight="700" fill="#3d4a30">No results found</text>
  <text x="400" y="534" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="17" fill="#8a9a78">Try a different search or clear your filters</text>
</svg>
