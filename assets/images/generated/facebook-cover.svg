<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="720" viewBox="0 0 1640 720">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e08"/>
      <stop offset="100%" stop-color="#132018"/>
    </linearGradient>
  </defs>
  <rect width="1640" height="720" fill="url(#fbg)"/>

  <!-- tagline, left, kept out of the FB profile-photo safe zone -->
  <text x="90" y="330" font-family="Verdana, Arial, sans-serif" font-weight="800" font-size="64" fill="#f3f7ec">Buy &amp; sell anything</text>
  <text x="90" y="400" font-family="Verdana, Arial, sans-serif" font-weight="800" font-size="64" fill="#7cfc00">in South Sudan</text>
  <text x="90" y="450" font-family="Verdana, Arial, sans-serif" font-size="26" fill="#8a9a78">nilelink · free listings · verified sellers</text>

  <!-- tilted listing-card grid, right side -->
  <g transform="translate(1180,180) rotate(-6)">
    <g>
      <rect x="0" y="0" width="180" height="220" rx="16" fill="#11160d" stroke="#233015" stroke-width="2"/>
      <rect x="16" y="16" width="148" height="110" rx="10" fill="#1a2113"/>
      <rect x="16" y="140" width="90" height="16" rx="6" fill="#7cfc00"/>
      <rect x="16" y="164" width="120" height="12" rx="5" fill="#39472c"/>
    </g>
    <g transform="translate(210,40) rotate(8)">
      <rect x="0" y="0" width="180" height="220" rx="16" fill="#11160d" stroke="#233015" stroke-width="2"/>
      <rect x="16" y="16" width="148" height="110" rx="10" fill="#1a2113"/>
      <rect x="16" y="140" width="90" height="16" rx="6" fill="#7cfc00"/>
      <rect x="16" y="164" width="120" height="12" rx="5" fill="#39472c"/>
    </g>
  </g>
</svg>
