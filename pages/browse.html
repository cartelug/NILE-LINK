<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Browse — Nile Link</title>
<meta name="theme-color" content="#0a0e08">
<link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg?v=20260706i">
<link rel="apple-touch-icon" href="../assets/images/apple-touch-icon.png?v=20260706i">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css?v=20260706i">
<link rel="stylesheet" href="../assets/css/main.css?v=20260706i">
<link rel="stylesheet" href="../assets/css/pages.css?v=20260706i">
</head>
<body data-page="browse" class="has-mobnav">
<div class="app-shell">
<div data-nl-nav></div>

<div class="page-head"><div class="wrap">
  <div>
    <div class="crumbs"><a href="../index.html">Home</a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg><span id="crumbCat">All listings</span></div>
    <h1 id="browseTitle">Browse listings</h1>
    <div class="sub" id="browseSub">Phones, cars, property, fashion & services across South Sudan</div>
  </div>
</div></div>

<!-- Top category strip (mobile + desktop) -->
<div class="cat-strip" id="catStrip"></div>

<div class="wrap browse-wrap">
  <!-- Filters (desktop sidebar) -->
  <aside class="filters" id="filters">
    <div class="flt-card"><h4>Neighbourhood</h4><div id="fltHoods"></div></div>
    <div class="flt-card"><h4>Max price (USD)</h4>
      <input type="range" class="flt-range" id="fltMax" min="20" max="42000" value="42000" step="10">
      <div class="flt-range-val">Up to <span id="fltMaxVal">$42,000</span></div>
    </div>
    <div class="flt-card"><h4>Listing type</h4>
      <div class="flt-radio" id="fltType">
        <label class="check"><input type="radio" name="ftype" value="all" checked> All types</label>
        <label class="check"><input type="radio" name="ftype" value="products"> Products</label>
        <label class="check"><input type="radio" name="ftype" value="vehprop"> Cars & Property</label>
        <label class="check"><input type="radio" name="ftype" value="services"> Services</label>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <div class="browse-main">
    <div class="browse-bar">
      <div class="browse-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input id="browseSearch" type="search" placeholder="Search listings…" autocomplete="off">
      </div>
      <button class="flt-trigger" id="fltTrigger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Filters</button>
      <select class="browse-sort" id="browseSort">
        <option value="featured">Featured</option>
        <option value="newest">Newest</option>
        <option value="low">Price: Low → High</option>
        <option value="high">Price: High → Low</option>
      </select>
    </div>

    <!-- Quick filter pills + view toggle -->
    <div class="browse-pills" id="browsePills">
      <button class="brp" data-pill="verified"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg>Verified only</button>
      <button class="brp" data-pill="photos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 16l-5-5L5 21"/></svg>With photos</button>
      <button class="brp" data-pill="under100">Under $100</button>
      <button class="brp" data-pill="under1k">Under $1,000</button>
      <button class="brp" data-pill="boosted"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L3 14h7l-1 8 10-12h-7z"/></svg>Boosted</button>
      <button class="brp" data-pill="negotiable">Negotiable</button>
    </div>

    <div class="active-filters" id="activeFilters"></div>

    <div class="browse-tools">
      <div class="browse-count" id="browseCount" style="margin:0"></div>
      <div class="browse-tools-r">
        <button class="save-search" id="saveSearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 6.4L21 9l-5 4.5L17.5 21 12 17.3 6.5 21 8 13.5 3 9l6.6-.6z"/></svg>Save this search</button>
        <div class="view-toggle">
          <button class="on" data-view="grid"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Grid</button>
          <button data-view="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11z"/><circle cx="12" cy="10" r="2.2"/></svg>Map</button>
        </div>
      </div>
    </div>

    <div id="browseView">
      <div class="grid" id="browseGrid"></div>
      <div class="browse-map" id="browseMap" style="display:none">
        <span class="map-pin" style="top:30%;left:42%"></span>
        <span class="map-pin" style="top:55%;left:60%;background:#ea580c;box-shadow:0 4px 10px rgba(234,88,12,.4)"></span>
        <span class="map-pin" style="top:42%;left:25%;background:#3b82f6;box-shadow:0 4px 10px rgba(59,130,246,.4)"></span>
        <span class="map-pin" style="top:65%;left:48%;background:#0d9488;box-shadow:0 4px 10px rgba(13,148,136,.4)"></span>
        <div>
          <h3>Map view — coming soon</h3>
          <p style="max-width:36ch;margin:0 auto">We're bringing live pins for every listing across Juba and beyond. Use grid view for now.</p>
        </div>
      </div>
    </div>
  </div>
</div>

<div data-nl-footer></div>
</div>

<!-- mobile filter sheet -->
<div class="sheet-scrim" id="sheetScrim"></div>
<div class="sheet" id="filterSheet">
  <div class="sheet-grip"></div>
  <div class="sheet-head"><h3>Filters</h3><button class="icon-btn" id="sheetClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div id="sheetBody"></div>
  <button class="btn btn-lime btn-block btn-lg" id="sheetApply" style="margin-top:14px">Show results</button>
</div>

<div data-nl-mobnav></div>
<script defer src="../assets/js/supabase-config.js?v=20260706i"></script>
<script defer src="../assets/js/supabase-client.js?v=20260706i"></script>
<script defer src="../assets/js/realtime.js?v=20260706i"></script>
<script defer src="../assets/js/data.js?v=20260706i"></script>
<script defer src="../assets/js/api.js?v=20260706i"></script>
<script defer src="../assets/js/core.js?v=20260706i"></script>
<script defer src="../assets/js/i18n.js?v=20260706i"></script>
<script defer src="../assets/js/browse.js?v=20260706i"></script>
</body>
</html>
